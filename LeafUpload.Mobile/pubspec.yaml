name: krishimitra_mobile
description: KrishiMitra AI mobile app for farmers
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.5.0
  http_parser: ^4.1.2
  shared_preferences: ^2.5.3
  flutter_svg: ^2.2.0
  google_fonts: ^6.3.2
  intl: ^0.20.2
  image_picker: ^1.1.2
  geolocator: ^13.0.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/icon/app_icon.png"
  android_12:
    color: "#FFFFFF"
    image: "assets/icon/app_icon.png"